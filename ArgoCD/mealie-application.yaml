apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mealie-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/marcoa001/mealie.git
    targetRevision: HEAD
    path: mealie-chart
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: mealie-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true