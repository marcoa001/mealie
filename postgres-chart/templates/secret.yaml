apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: {{ .Values.namespace }}
type: Opaque
data:
  POSTGRES_PASSWORD: {{ .Values.secret.password | b64enc }}
  POSTGRES_USER: {{ .Values.secret.user | b64enc }}
  POSTGRES_DB: {{ .Values.secret.db | b64enc }}
  POSTGRES_SERVER: {{ .Values.secret.server | b64enc }}
  POSTGRES_PORT: {{ .Values.secret.port | toString | b64enc }} 