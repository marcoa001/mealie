# Configuración base de Kong
kong:
  # DB-less mode
  env:
    database: "off"

  # Ingress Controller
  ingressController:
    enabled: true
    ingressClass: kong

  # Admin API
  admin:
    enabled: true
    http:
      enabled: true
    tls:
      parameters: []

# Exponer el proxy como NodePort con puerto fijo
proxy:
  type: NodePort
  http:
    enabled: true
    nodePort: 30768
  tls:
    enabled: false