---
# Service Account para la aplicación Mealie
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mealie-app-sa
  namespace: mealie-db
  labels:
    app: mealie
    component: application
---
# Service Account para operaciones de base de datos
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-operator-sa
  namespace: mealie-db
  labels:
    app: postgres
    component: operator
---
# Service Account para monitoreo
apiVersion: v1
kind: ServiceAccount
metadata:
  name: monitoring-sa
  namespace: monitoring
  labels:
    app: monitoring
    component: prometheus
---
# Service Account para el postgres exporter
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-exporter-sa
  namespace: mealie-db
  labels:
    app: postgres-exporter
    component: exporter 