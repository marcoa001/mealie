---
# Network Policy para el namespace mealie-db
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mealie-db-network-policy
  namespace: mealie-db
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Permitir tráfico desde la aplicación Mealie
  - from:
    - podSelector:
        matchLabels:
          app: mealie
    ports:
    - protocol: TCP
      port: 5432
  # Permitir tráfico desde el postgres exporter
  - from:
    - podSelector:
        matchLabels:
          app: postgres-exporter
    ports:
    - protocol: TCP
      port: 5432
  # Permitir tráfico desde pgAdmin
  - from:
    - podSelector:
        matchLabels:
          app: pgadmin
    ports:
    - protocol: TCP
      port: 5432
  egress:
  # Permitir tráfico saliente a DNS
  - to: []
    ports:
    - protocol: UDP
      port: 53
  # Permitir tráfico saliente a servicios internos
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: TCP
      port: 443
---
# Network Policy para el postgres exporter
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-exporter-network-policy
  namespace: mealie-db
spec:
  podSelector:
    matchLabels:
      app: postgres-exporter
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Permitir tráfico desde Prometheus
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 9187
  egress:
  # Permitir tráfico saliente a DNS
  - to: []
    ports:
    - protocol: UDP
      port: 53
  # Permitir tráfico saliente a PostgreSQL
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
---
# Network Policy para el namespace monitoring
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring-network-policy
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Permitir tráfico desde Grafana
  - from:
    - podSelector:
        matchLabels:
          app: grafana
    ports:
    - protocol: TCP
      port: 9090
  egress:
  # Permitir tráfico saliente a DNS
  - to: []
    ports:
    - protocol: UDP
      port: 53
  # Permitir tráfico saliente a exporters
  - to:
    - namespaceSelector:
        matchLabels:
          name: mealie-db
    ports:
    - protocol: TCP
      port: 9187
---
# Network Policy para Grafana
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-network-policy
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app: grafana
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Permitir tráfico HTTP/HTTPS
  - from: []
    ports:
    - protocol: TCP
      port: 3000
    - protocol: TCP
      port: 443
  egress:
  # Permitir tráfico saliente a DNS
  - to: []
    ports:
    - protocol: UDP
      port: 53
  # Permitir tráfico saliente a Prometheus
  - to:
    - podSelector:
        matchLabels:
          app: prometheus
    ports:
    - protocol: TCP
      port: 9090 