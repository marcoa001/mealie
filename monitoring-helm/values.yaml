# Configuración para kube-prometheus-stack
kube-prometheus-stack:
  grafana:
    grafana.ini:
      server:
        # Define how Grafana is accessed externally
        # You may need to adjust this based on your ingress or NodePort setup
        root_url: "http://localhost:3000/"
      auth:
        disable_login_form: false
      auth.generic_oauth:
        verbose_logging: true
        enabled: true
        name: Keycloak
        allow_sign_up: true
        client_id: grafana 
        client_secret: 0HfA65iSMzgU3tU4sEruWKEubz4O7ZtA 
        scopes: openid email profile
        # auth_url must be accessible from the user's browser
        #auth_url: http://keycloak.keycloak.svc.cluster.local:80/realms/test-realm/protocol/openid-connect/auth   ver despues
        auth_url: http://localhost:30080/realms/grafana/protocol/openid-connect/auth
        # token_url and api_url are server-to-server communications
        token_url: http://keycloak.keycloak.svc.cluster.local:80/realms/grafana/protocol/openid-connect/token
        api_url: http://keycloak.keycloak.svc.cluster.local:80/realms/grafana/protocol/openid-connect/userinfo
        role_attribute_path: "contains(realm_access.roles[*], 'admin') && 'Admin' || 'Viewer'"      
        login_attribute_path: preferred_username
        name_attribute_path: name
        email_attribute_path: email

    # Persistencia para Grafana
    persistence:
      enabled: true
      size: 1Gi
      storageClass: ""
      accessMode: ReadWriteOnce
      annotations: {}

# Configuración para Loki
loki:
  # Aquí puedes agregar configuraciones específicas de Loki si es necesario
  # Por defecto usará los valores del chart oficial
