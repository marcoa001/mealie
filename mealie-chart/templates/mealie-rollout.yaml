{{- if .Values.rollouts.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ .Values.mealie.name }}
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.mealie.replicas }}
  revisionHistoryLimit: 3
  strategy:
    canary:
      maxUnavailable: {{ .Values.rollouts.canary.maxUnavailable }}
      maxSurge: {{ .Values.rollouts.canary.maxSurge }}
      steps:
{{ toYaml .Values.rollouts.canary.steps | indent 8 }}
  selector:
    matchLabels:
      app: {{ .Values.mealie.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.mealie.name }}
    spec:
      serviceAccountName: mealie-app-sa
      containers:
        - name: {{ .Values.mealie.name }}
          image: {{ .Values.mealie.image.repository }}:{{ .Values.mealie.image.tag }}
          ports:
            - containerPort: {{ .Values.mealie.service.port }}
          envFrom:
            - secretRef:
                name: postgres-secret
          env:
            - name: ALLOW_SIGNUP
              value: "{{ .Values.mealie.allowSignup }}"
            - name: TZ
              value: {{ .Values.mealie.timezone }}
            - name: BASE_URL
              value: {{ .Values.mealie.baseUrl }}
            - name: DB_ENGINE
              value: {{ .Values.mealie.dbEngine }}
          volumeMounts:
            - name: mealie-data
              mountPath: /app/data
      volumes:
        - name: mealie-data
          persistentVolumeClaim:
            claimName: mealie-pvc
{{- end }}

