apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "mealie.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mealie.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    canary:
      steps:
      # Paso 1: Desplegar 10% del tráfico
      - setWeight: 10
      - pause:
          duration: 30s
          # Pausa para análisis manual o automático
      
      # Paso 2: Desplegar 25% del tráfico
      - setWeight: 25
      - pause:
          duration: 1m
      
      # Paso 3: Desplegar 50% del tráfico
      - setWeight: 50
      - pause:
          duration: 2m
      
      # Paso 4: Desplegar 100% del tráfico
      - setWeight: 100
      
      # Configuración de rollback automático
      analysis:
        templates:
        - templateName: success-rate
        args:
        - name: service-name
          value: {{ include "mealie.fullname" . }}-canary
        - name: success-rate
          value: "95"
        - name: interval
          value: "30s"
        - name: count
          value: "5"
      
      # Rollback automático si falla el análisis
      rollback:
        onAnalysisFailure: true
        onError: true
        onTimeout: true
        timeout: 5m
  
  selector:
    matchLabels:
      {{- include "mealie.selectorLabels" . | nindent 6 }}
  
  template:
    metadata:
      labels:
        {{- include "mealie.selectorLabels" . | nindent 8 }}
    spec:
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
