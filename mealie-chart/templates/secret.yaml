apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: {{ .Values.namespace }}
type: Opaque
data:
  POSTGRES_PASSWORD: {{ .Values.dbSecret.password | b64enc }}
  POSTGRES_USER: {{ .Values.dbSecret.user | b64enc }}
  POSTGRES_DB: {{ .Values.dbSecret.db | b64enc }}
  POSTGRES_SERVER: {{ .Values.dbSecret.server | b64enc }}
  POSTGRES_PORT: {{ .Values.dbSecret.port | toString | b64enc }} 