{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mealie
  namespace: {{ .Values.namespace }}
  annotations:
    konghq.com/strip-path: "true"
    {{- if .Values.kong.basicAuth.enabled }}
    konghq.com/plugins: mealie-basic-auth
    {{- end }}
spec:
  ingressClassName: kong
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.mealie.name }}
                port:
                  number: {{ .Values.mealie.service.port }}
{{- end }} 