{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mealie
  namespace: {{ .Values.namespace }}
spec:
  {{- if .Values.ingress.kong.enabled }}
  ingressClassName: {{ .Values.ingress.kong.ingressClassName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.mealie.name }}
                port:
                  number: {{ .Values.mealie.service.port }}
{{- end }} 