apiVersion: v1
kind: Service
metadata:
  name: {{ include "mealie.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mealie.labels" . | nindent 4 }}
  annotations:
    # Anotación para Argo Rollouts
    rollouts.argoproj.io/primary-service: "true"
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "mealie.selectorLabels" . | nindent 4 }}
---
# Servicio canary para análisis
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mealie.fullname" . }}-canary
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mealie.labels" . | nindent 4 }}
    app.kubernetes.io/component: canary
  annotations:
    rollouts.argoproj.io/canary-service: "true"
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "mealie.selectorLabels" . | nindent 4 }}
