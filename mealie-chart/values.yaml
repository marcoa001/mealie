namespace: mealie-app

ingress:
  enabled: true
  host: mealie.local
  # Configuración de Kong
  kong:
    enabled: true
    ingressClassName: kong

# Argo Rollouts (canary)
rollouts:
  enabled: true
  canary:
    # Ajustes de capacidad durante el canary
    maxUnavailable: 0
    maxSurge: 1
    # Pasos por defecto del canary (sin trafficRouting)
    steps:
      - setWeight: 25
      - pause:
          duration: 30
      - setWeight: 50
      - pause:
          duration: 60
      - setWeight: 75
      - pause:
          duration: 120
    abortScaleDownDelaySeconds: 30
  progressDeadlineSeconds: 60

mealie:
  name: mealie
  image:
    repository: ghcr.io/mealie-recipes/mealie
    tag: v3.0.1
  replicas: 4
  allowSignup: false
  timezone: America/Anchorage
  baseUrl: http://mealie.local
  dbEngine: postgres
  data:
    storage: 2Gi
  service:
    type: NodePort
    port: 9000   # Puerto de la aplicación
    nodePort: 30925  # Puerto del nodo

# Configuración de conexión a la base de datos externa (debe coincidir con el postgres-chart)
dbSecret:
  user: mealie
  password: mealie
  db: mealie
  server: postgres.mealie-db.svc.cluster.local
  port: 5432
