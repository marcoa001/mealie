namespace: mealie-app

ingress:
  enabled: true
  host: mealie.local

kong:
  basicAuth:
    enabled: true
    username: mealie-user
    password: mypassword

mealie:
  name: mealie
  image:
    repository: ghcr.io/mealie-recipes/mealie
    tag: v3.0.1
  replicas: 2
  allowSignup: false
  timezone: America/Anchorage
  baseUrl: https://mealie.yourdomain.com
  dbEngine: postgres
  data:
    storage: 2Gi
  service:
    type: NodePort
    port: 9000
    nodePort: 30925

# Configuración de conexión a la base de datos externa (debe coincidir con el postgres-chart)
dbSecret:
  user: mealie
  password: mealie
  db: mealie
  server: postgres.mealie-db.svc.cluster.local
  port: 5432
