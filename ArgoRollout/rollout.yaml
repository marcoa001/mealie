apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: mealie-canary
  namespace: mealie-app
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: mealie
  template:
    metadata:
      labels:
        app: mealie
    spec:
      containers:
      - name: mealie
        image: ghcr.io/mealie-recipes/mealie:v3.0.1
        imagePullPolicy: Always
        ports:
        - containerPort: 9000
        env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: mealie-db-secret
              key: user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mealie-db-secret
              key: password
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: mealie-db-secret
              key: db
        - name: DB_SERVER
          valueFrom:
            secretKeyRef:
              name: mealie-db-secret
              key: server
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: mealie-db-secret
              key: port
        - name: BASE_URL
          value: "http://mealie.local"
        - name: ALLOW_SIGNUP
          value: "false"
        - name: TIMEZONE
          value: "America/Anchorage"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/app/about
            port: 9000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/app/about
            port: 9000
          initialDelaySeconds: 5
          periodSeconds: 5
  strategy:
    canary:
      # Configuración del análisis para rollbacks automáticos
      analysis:
        templates:
        - templateName: success-rate
        - templateName: latency
        args:
        - name: service
          value: mealie-canary
        - name: ingress
          value: mealie.local
      # Configuración del escalado gradual
      steps:
      # Paso 1: Desplegar 10% del tráfico
      - setWeight: 10
      - pause:
          duration: 30s
      # Paso 2: Análisis de métricas
      - analysis:
          templates:
          - templateName: success-rate
          - templateName: latency
          args:
          - name: service
            value: mealie-canary
      # Paso 3: Desplegar 50% del tráfico
      - setWeight: 50
      - pause:
          duration: 1m
      # Paso 4: Análisis final
      - analysis:
          templates:
          - templateName: success-rate
          - templateName: latency
          args:
          - name: service
            value: mealie-canary
      # Paso 5: Desplegar 100% del tráfico
      - setWeight: 100
      # Rollback automático si falla el análisis
      rollbackWindow:
        deployment: 5m
        replicaSet: 5m
      # Configuración del rollback
      maxUnavailable: 1
      maxSurge: 2