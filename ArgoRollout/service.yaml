kind: Service
apiVersion: v1
metadata:
  name: mealie-canary
  namespace: mealie-app
spec:
  selector:
    app: mealie
  ports:
  - protocol: TCP
    port: 9000
    targetPort: 9000
  type: NodePort
  nodePort: 30925

---
kind: Service
apiVersion: v1
metadata:
  name: mealie-stable
  namespace: mealie-app
spec:
  selector:
    app: mealie
  ports:
  - protocol: TCP
    port: 9000
    targetPort: 9000
  type: NodePort
  nodePort: 30926