apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mealie-canary-ingress
  namespace: mealie-app
  annotations:
    kubernetes.io/ingress.class: kong
    konghq.com/strip-path: "true"
    konghq.com/plugins: "canary-analysis"
spec:
  rules:
  - host: mealie.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mealie-canary
            port:
              number: 9000