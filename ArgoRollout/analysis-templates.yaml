apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate
  namespace: mealie-app
spec:
  args:
  - name: service
  - name: ingress
  metrics:
  - name: success-rate
    interval: 30s
    count: 5
    successCondition: result[0] >= 0.95
    failureCondition: result[0] < 0.90
    provider:
      prometheus:
        address: http://prometheus.monitoring.svc.cluster.local:9090
        query: |
          sum(rate(http_requests_total{service="{{args.service}}", status!~"5.."}[5m])) 
          / 
          sum(rate(http_requests_total{service="{{args.service}}"}[5m]))

---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: latency
  namespace: mealie-app
spec:
  args:
  - name: service
  - name: ingress
  metrics:
  - name: latency
    interval: 30s
    count: 5
    successCondition: result[0] <= 0.5
    failureCondition: result[0] > 1.0
    provider:
      prometheus:
        address: http://prometheus.monitoring.svc.cluster.local:9090
        query: |
          histogram_quantile(0.95, 
            sum(rate(http_request_duration_seconds_bucket{service="{{args.service}}"}[5m])) by (le)
          )

---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: error-rate
  namespace: mealie-app
spec:
  args:
  - name: service
  - name: ingress
  metrics:
  - name: error-rate
    interval: 30s
    count: 3
    successCondition: result[0] <= 0.05
    failureCondition: result[0] > 0.10
    provider:
      prometheus:
        address: http://prometheus.monitoring.svc.cluster.local:9090
        query: |
          sum(rate(http_requests_total{service="{{args.service}}", status=~"5.."}[5m])) 
          / 
          sum(rate(http_requests_total{service="{{args.service}}"}[5m]))
